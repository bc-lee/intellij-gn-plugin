name: Verify

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

  workflow_dispatch:

  schedule:
    # every First Saturday of the month at 00:00 UTC
    - cron: "0 0 1-7 * 6"

jobs:

  verify:
    name: Verify
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Disable cache write since this workflow since this workflow is executed after the build workflow
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: Show disk usage before verifier
        shell: bash
        run: |
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          paths=(/ "$GITHUB_WORKSPACE" "$RUNNER_TEMP")
          if [ -d "$gradle_home" ]; then
            paths+=("$gradle_home")
          fi

          echo "== Filesystem free space =="
          df -h "${paths[@]}"

          echo
          echo "== Workspace and cache sizes =="
          du -sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$gradle_home" 2>/dev/null || true

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool
      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPlugin

      - name: Show disk usage after verifier
        if: ${{ always() }}
        shell: bash
        run: |
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          paths=(/ "$GITHUB_WORKSPACE" "$RUNNER_TEMP")
          if [ -d "$gradle_home" ]; then
            paths+=("$gradle_home")
          fi

          echo "== Filesystem free space =="
          df -h "${paths[@]}"

          echo
          echo "== Workspace and cache sizes =="
          du -sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$gradle_home" 2>/dev/null || true

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
